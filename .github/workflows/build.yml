name: Convert HTML to APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Utiliser l'action de conversion HTML vers APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: '.' 
          app-name: 'MonApplication'
          output-dir: 'output_apk' # Évite le conflit de dossier

      - name: Télécharger l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-application-apk
          path: output_apk/
```[cite: 1, 2]

### Comment appliquer la correction :
1. Sur GitHub, ouvrez votre fichier `.github/workflows/build.yml`[cite: 1].
2. Cliquez sur l'icône du crayon pour le modifier[cite: 1].
3. Ajoutez la ligne `output-dir: 'output_apk'` et changez `path: apk/` par `path: output_apk/`.
4. Enregistrez en cliquant sur **Commit changes**[cite: 1].
5. Retournez dans l'onglet **Actions** pour relancer un test.

