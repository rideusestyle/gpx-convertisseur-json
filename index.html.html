<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR55Nav - Éditeur JSON Conforme (Anti-IQ)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
        }

        header {
            background-color: #1e293b;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #38bdf8;
        }

        .badge {
            background-color: #10b981;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        #toolbar {
            background-color: #1e293b;
            padding: 1rem 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #334155;
        }

        .btn {
            background-color: #0284c7;
            color: white;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .btn-success {
            background-color: #10b981;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        input[type="file"] {
            display: none;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .control-group label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stats-container {
            display: flex;
            gap: 1rem;
            margin-left: auto;
            background-color: #0f172a;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-val {
            font-weight: bold;
            color: #38bdf8;
            font-size: 0.95rem;
        }

        .stat-lbl {
            font-size: 0.7rem;
            color: #64748b;
        }

        #main-content {
            flex: 1;
            display: flex;
            position: relative;
        }

        #map {
            flex: 1;
            height: 100%;
            z-index: 1;
        }

        #watch-simulator {
            width: 320px;
            background-color: #1e293b;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            gap: 1rem;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .watch-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .watch-screen {
            width: 220px;
            height: 220px;
            background-color: #000000;
            border-radius: 50%;
            border: 6px solid #334155;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        #watchCanvas {
            width: 100%;
            height: 100%;
        }

        .watch-info {
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            line-height: 1.4;
        }

        .drop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(2, 132, 199, 0.85);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #main-content.drag-over .drop-overlay {
            opacity: 1;
        }
    </style>
</head>
<body>

    <header>
        <h1>FR55Nav - Éditeur JSON Conforme</h1>
        <span class="badge">Garmin FR55</span>
    </header>

    <div id="toolbar">
        <label for="gpxInput" class="btn">
            📂 Choisir un GPX
        </label>
        <input type="file" id="gpxInput" accept=".gpx">

        <button id="sendBtn" class="btn btn-success" disabled>
            🚀 Exporter route.json
        </button>

        <div class="control-group">
            <label for="sampleRate">Simplification (Précision)</label>
            <select id="sampleRate" style="background: #0f172a; color: white; border: 1px solid #334155; padding: 0.4rem; border-radius: 4px;">
                <option value="25">Forte (Sécurisée FR55)</option>
                <option value="15" selected>Moyenne (Bon compromis)</option>
                <option value="5">Détaillé</option>
            </select>
        </div>

        <div class="stats-container">
            <div class="stat-item">
                <span class="stat-val" id="statPoints">0</span>
                <span class="stat-lbl">Bruts</span>
            </div>
            <div class="stat-item">
                <span class="stat-val" id="statExport">0</span>
                <span class="stat-lbl">Simplifiés</span>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div class="drop-overlay">Déposez votre fichier GPX ici</div>
        <div id="map"></div>

        <div id="watch-simulator">
            <span class="watch-title">Simulateur FR55</span>
            <div class="watch-screen">
                <canvas id="watchCanvas" width="220" height="220"></canvas>
            </div>
            <div class="watch-info" id="watchInfoText">
                En attente d'un tracé GPX...
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map').setView([46.603354, 1.888334], 6);

        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; OpenStreetMap contributors'
        }).addTo(map);

        let rawCoordinates = [];
        let currentPolyline = null;
        let altLayers = [], bgLayers = [];
        let O = null, V = [], ALTERNATIVES = [], BACKGROUND_ROADS = [];
        
        const MAX_SAFE_SIZE = 3584; // 3.5 Ko max pour la RAM de la FR55

        const gpxInput = document.getElementById('gpxInput');
        const sendBtn = document.getElementById('sendBtn');
        const sampleRateSelect = document.getElementById('sampleRate');
        const statPoints = document.getElementById('statPoints');
        const statExport = document.getElementById('statExport');
        const mainContent = document.getElementById('main-content');
        const watchCanvas = document.getElementById('watchCanvas');
        const watchCtx = watchCanvas.getContext('2d');
        const watchInfoText = document.getElementById('watchInfoText');

        ['dragenter', 'dragover'].forEach(e => mainContent.addEventListener(e, ev => { ev.preventDefault(); mainContent.classList.add('drag-over'); }));
        ['dragleave', 'drop'].forEach(e => mainContent.addEventListener(e, ev => { ev.preventDefault(); mainContent.classList.remove('drag-over'); }));
        mainContent.addEventListener('drop', e => { if (e.dataTransfer.files.length) parseGPXFile(e.dataTransfer.files[0]); });
        gpxInput.addEventListener('change', e => { if (e.target.files.length) parseGPXFile(e.target.files[0]); });
        sampleRateSelect.addEventListener('change', updateEverything);

        function parseGPXFile(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const xmlDoc = new DOMParser().parseFromString(event.target.result, "text/xml");
                    let pts = xmlDoc.getElementsByTagName("trkpt");
                    if (!pts.length) pts = xmlDoc.getElementsByTagName("rtept");
                    if (!pts.length) pts = xmlDoc.getElementsByTagName("wpt");

                    rawCoordinates = [];
                    for (let i = 0; i < pts.length; i++) {
                        const lat = parseFloat(pts[i].getAttribute("lat"));
                        const lon = parseFloat(pts[i].getAttribute("lon"));
                        if (!isNaN(lat) && !isNaN(lon)) rawCoordinates.push([lat, lon]);
                    }

                    if (!rawCoordinates.length) {
                        alert("Aucune coordonnée valide trouvée.");
                        return;
                    }
                    updateEverything();
                } catch (err) {
                    alert("Erreur de lecture du GPX.");
                }
            };
            reader.readAsText(file);
        }

        function dseg(p, a, b) {
            const dx = b[0]-a[0], dy = b[1]-a[1], l = dx*dx + dy*dy;
            let t = l ? ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/l : 0;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p[0]-a[0]-t*dx, p[1]-a[1]-t*dy);
        }

        function simplify(P, tol) {
            const n = P.length; if (n < 3) return P;
            const k = new Array(n).fill(false); k[0] = k[n-1] = true;
            const st = [[0, n-1]];
            while (st.length) {
                const [a, b] = st.pop(); let md = 0, mi = -1;
                for (let i = a+1; i < b; i++) {
                    const d = dseg(P[i], P[a], P[b]);
                    if (d > md) { md = d; mi = i; }
                }
                if (md > tol && mi > 0) { k[mi] = true; st.push([a, mi], [mi, b]); }
            }
            return P.filter((_, i) => k[i]);
        }

        const proj = (la, lo) => [(lo - O.lo) * O.k, -(la - O.la) * 110540];

        function updateEverything() {
            if (!rawCoordinates.length) return;

            statPoints.textContent = rawCoordinates.length;

            O = { la: rawCoordinates[0][0], lo: rawCoordinates[0][1] };
            O.k = Math.cos(O.la * Math.PI / 180) * 111320;

            const tol = parseInt(sampleRateSelect.value, 10);
            V = simplify(rawCoordinates.map(c => proj(c[0], c[1])), tol);
            statExport.textContent = V.length;

            // Génération des intersections alternatives "a"
            ALTERNATIVES = [];
            for (let i = 2; i < V.length - 2; i += 3) {
                const a = [V[i][0]-V[i-2][0], V[i][1]-V[i-2][1]], b = [V[i+2][0]-V[i][0], V[i+2][1]-V[i][1]];
                if (Math.hypot(a[0], a[1]) < 25 || Math.hypot(b[0], b[1]) < 25) continue;
                const g = Math.atan2(a[0]*b[1] - a[1]*b[0], a[0]*b[0] + a[1]*b[1]) * 180 / Math.PI;
                if (Math.abs(g) > 40) {
                    const perpX = -a[1] * 0.25, perpY = a[0] * 0.25;
                    ALTERNATIVES.push([
                        [Math.round(V[i][0]), Math.round(V[i][1])],
                        [Math.round(V[i][0] + perpX), Math.round(V[i][1] + perpY)]
                    ]);
                }
            }

            // Génération d'un fond de carte "r" léger basé sur le parcours
            BACKGROUND_ROADS = [];
            if (V.length > 5) {
                let subRoad1 = [];
                let subRoad2 = [];
                for (let i = 0; i < V.length; i += Math.max(1, Math.floor(V.length / 5))) {
                    subRoad1.push([Math.round(V[i][0] + 50), Math.round(V[i][1] + 50)]);
                    subRoad2.push([Math.round(V[i][0] - 60), Math.round(V[i][1] - 30)]);
                }
                BACKGROUND_ROADS = [
                    [1, subRoad1],
                    [0, subRoad2]
                ];
            }

            if (currentPolyline) map.removeLayer(currentPolyline);
            altLayers.forEach(l => map.removeLayer(l));
            bgLayers.forEach(l => map.removeLayer(l));
            altLayers = [];
            bgLayers = [];

            const unproj = (pt) => [O.la - pt[1]/110540, O.lo + pt[0]/O.k];
            
            // Affichage fond sur Leaflet
            BACKGROUND_ROADS.forEach(r => {
                const ptsLonLat = r[1].map(unproj);
                const l = L.polyline(ptsLonLat, { color: r[0] === 1 ? '#475569' : '#334155', weight: r[0] === 1 ? 2 : 1 }).addTo(map);
                bgLayers.push(l);
            });

            currentPolyline = L.polyline(V.map(unproj), { color: '#0284c7', weight: 4 }).addTo(map);

            ALTERNATIVES.forEach(alt => {
                const l = L.polyline([unproj(alt[0]), unproj(alt[1])], { color: '#64748b', weight: 2, dashArray: '2,2' }).addTo(map);
                altLayers.push(l);
            });

            map.fitBounds(currentPolyline.getBounds(), { padding: [30, 30] });

            renderWatchScreen();
            sendBtn.disabled = false;
        }

        // Export respectant strictement votre structure JSON demandée
        function exportJSON() {
            const rd = a => [Math.round(a[0]), Math.round(a[1])];
            const data = {
                la: +O.la.toFixed(5),
                lo: +O.lo.toFixed(5),
                t: V.map(rd),
                r: BACKGROUND_ROADS,
                a: ALTERNATIVES.map(alt => [rd(alt[0]), rd(alt[1])])
            };
            return JSON.stringify(data);
        }

        function renderWatchScreen() {
            const c = watchCtx, W = watchCanvas.width;
            c.fillStyle = '#000000'; c.fillRect(0, 0, W, W);
            if (!V.length) return;

            let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
            V.forEach(p => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });

            const s2 = (W - 40) / Math.max(x1 - x0, y1 - y0, 1);
            const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
            const X = x => W / 2 + (x - cx) * s2;
            const Y = y => W / 2 + (y - cy) * s2;

            // Dessin fond "r" sur la montre
            BACKGROUND_ROADS.forEach(r => {
                c.strokeStyle = r[0] === 1 ? '#475569' : '#334155';
                c.lineWidth = r[0] === 1 ? 2 : 1;
                c.beginPath();
                r[1].forEach((pt, k) => k ? c.lineTo(X(pt[0]), Y(pt[1])) : c.moveTo(X(pt[0]), Y(pt[1])));
                c.stroke();
            });

            // Dessin alternatives "a" sur la montre
            c.strokeStyle = '#64748b'; c.lineWidth = 1.5;
            ALTERNATIVES.forEach(alt => {
                c.beginPath();
                c.moveTo(X(alt[0][0]), Y(alt[0][1]));
                c.lineTo(X(alt[1][0]), Y(alt[1][1]));
                c.stroke();
            });

            // Dessin tracé principal "t" sur la montre
            c.strokeStyle = '#38bdf8'; c.lineWidth = 2.5; c.lineCap = 'round'; c.lineJoin = 'round';
            c.beginPath();
            V.forEach((p, k) => k ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1])));
            c.stroke();

            const bytes = exportJSON().length;
            const isSafe = bytes <= MAX_SAFE_SIZE;
            watchInfoText.innerHTML = `${V.length} pts · ${BACKGROUND_ROADS.length} fonds<br>Poids : <b>${(bytes/1024).toFixed(1)} Ko</b> <span style="color:${isSafe ? '#10b981' : '#f87171'}">${isSafe ? '✓ OK FR55' : '⚠ Trop lourd'}</span>`;
        }

        sendBtn.addEventListener('click', () => {
            if (!V.length) return;
            const blob = new Blob([exportJSON()], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'route.json';
            link.click();
        });
    </script>
</body>
</html>
